[build]
builder = "RAILPACK"
buildCommand = "cargo build --release"
watchPatterns = [
  "src/**",
  "templates/**",
  "migrations/**",
  "Cargo.toml",
  "Cargo.lock",
  "build.rs",
  "rust-toolchain.toml",
]

[deploy]
startCommand = "./target/release/ixirsii-tech"
healthcheckPath = "/"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
