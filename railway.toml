[build]
builder = "RAILPACK"
buildCommand = "cargo build --release --locked"
watchPatterns = [
    "src/**",
    "templates/**",
    "migrations/**",
    "Cargo.toml",
    "Cargo.lock",
    "build.rs",
    "railpack.json",
    "rust-toolchain.toml",
]

[deploy]
startCommand = "./target/release/ixirsii-tech"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
