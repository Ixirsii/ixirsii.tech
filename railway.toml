[build]
builder = "RAILPACK"
buildCommand = "SQLX_OFFLINE=true cargo build --release --locked && cp target/release/ixirsii-tech ixirsii-tech"
watchPatterns = [
    "src/**",
    "templates/**",
    "migrations/**",
    ".sqlx/**",
    ".cargo/config.toml",
    "Cargo.toml",
    "Cargo.lock",
    "build.rs",
    "railpack.json",
    "railway.toml",
    "rust-toolchain.toml",
]

[deploy]
startCommand = "env AUTH_CLIENT_IP_MODE=railway ./ixirsii-tech"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
