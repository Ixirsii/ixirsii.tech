{% extends "base.html" %} {% block content %}
<article class="mb-6">
  <h1>{{ project.name }}</h1>
  <p class="text-ctp-subtext0 text-lg">{{ project.tagline }}</p>

  {{ project.description|safe }}

  <div class="metadata">
    <div>Tech:</div>
    <div>{{ project.tech_tags|join(", ") }}</div>
  </div>

  <div class="flex gap-4 mt-6">
    <a href="{{ project.repo_url }}" target="_blank" rel="noopener noreferrer" class="button">Source</a>
    {% match project.website_url %}
    {% when Some with (url) %}
    <a href="{{ url }}" target="_blank" rel="noopener noreferrer" class="button">Website</a>
    {% when None %}
    {% endmatch %}
  </div>
</article>
{% endblock %}
