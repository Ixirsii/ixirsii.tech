{% extends "base.html" %} {% block content %}
<section aria-label="Administrator login">
  <div class="card login-card">
    <h1>Login</h1>

    <div class="login-copy">
      <p>Admin access is limited to this site's administrator.</p>
    </div>

    {% if let Some(message) = error %}
      {% if error_is_security %}
        {% include "security_alert.html" %}
      {% else %}
        <p class="form-alert" role="alert">
          <svg aria-hidden="true" focusable="false" viewBox="0 0 20 20" width="20" height="20">
            <path class="fill-ctp-red" fill-rule="evenodd" d="M10 1a9 9 0 1 0 0 18 9 9 0 0 0 0-18ZM9 5h2v6.5H9zM10 13a1.25 1.25 0 1 0 0 2.5 1.25 1.25 0 0 0 0-2.5Z"/>
          </svg>
          <span>{{ message }}</span>
        </p>
      {% endif %}
    {% endif %}

    <form class="login-form" action="/login" method="post">
      <input type="hidden" name="next" value="{{ next }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

      <div class="login-field">
        <label for="username">Username</label>
        <input
          id="username"
          name="username"
          type="text"
          value="{{ username }}"
          autocomplete="username"
          required
        >
      </div>

      <div class="login-field">
        <label for="password">Password</label>
        <input
          id="password"
          name="password"
          type="password"
          autocomplete="current-password"
          required
        >
      </div>

      <button class="button-primary" type="submit">Sign In</button>
    </form>
  </div>
</section>
{% endblock %}
