{% extends "base.html" %} {% block content %}
<section aria-label="Administrator login">
  <div class="card login-card">
    <h1>Login</h1>

    <div class="login-copy">
      <p>Admin access is limited to this site's administrator.</p>
    </div>

    {% if let Some(message) = error %}
      <p class="{% if error_is_security %}admin-security-alert{% else %}login-error{% endif %}">{% if error_is_security %}<strong>Security Check Failed.</strong> {% endif %}{{ message }}</p>
    {% endif %}

    <form class="login-form" action="/login" method="post">
      <input type="hidden" name="next" value="{{ next }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

      <div class="login-field">
        <label for="username">Username</label>
        <input
          id="username"
          name="username"
          type="text"
          value="{{ username }}"
          autocomplete="username"
          required
        >
      </div>

      <div class="login-field">
        <label for="password">Password</label>
        <input
          id="password"
          name="password"
          type="password"
          autocomplete="current-password"
          required
        >
      </div>

      <button class="button-primary" type="submit">Sign In</button>
    </form>
  </div>
</section>
{% endblock %}
