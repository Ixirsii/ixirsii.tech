      function updateSummary(theme) {
        var data = themes[theme] || themes['system'];
        document.getElementById('theme-summary-icon').innerHTML = data[1];
        document.getElementById('theme-summary-label').textContent = data[0];
      }
      function setTheme(theme) {
        if (theme === 'system') {
          var resolved = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'mocha' : 'latte';
          document.documentElement.dataset.theme = resolved;
          localStorage.removeItem('theme');
        } else {
          document.documentElement.dataset.theme = theme;
          localStorage.setItem('theme', theme);
        }
        updateSummary(theme);
        document.getElementById('theme-switcher').removeAttribute('open');
      }
      document.addEventListener('DOMContentLoaded', function() {
        var theme = localStorage.getItem('theme') || 'system';
        updateSummary(theme);
      });
      document.querySelectorAll('#theme-switcher [data-theme-value]').forEach(function(el) {
        el.addEventListener('click', function() {
          setTheme(this.getAttribute('data-theme-value'));
        });
      });
    </script>
