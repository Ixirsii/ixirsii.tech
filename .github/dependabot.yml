version: 2
updates:
  - package-ecosystem: "npm"
    directory: /
    open-pull-requests-limit: 10
    schedule:
      day: sunday
      interval: weekly
      time: 09:00
      timezone: America/Los_Angeles
    target-branch: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      day: sunday
      interval: weekly
      time: 09:00
      timezone: America/Los_Angeles
    target-branch: development
