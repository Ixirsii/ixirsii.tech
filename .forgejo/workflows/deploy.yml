name: Deploy

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: node24
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: https://data.forgejo.org/actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ forgejo.sha }}

      - name: Validate release tag
        run: |
          if [[ ! "$FORGEJO_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Invalid release tag: $FORGEJO_REF_NAME"
            exit 1
          fi

      - name: Verify release is on main
        run: |
          if ! git merge-base --is-ancestor "$FORGEJO_SHA" origin/main; then
            echo "Tagged commit is not an ancestor of main: $FORGEJO_SHA"
            exit 1
          fi

  build:
    needs: validate
    uses: ./.forgejo/workflows/build.yml

  security:
    needs: validate
    uses: ./.forgejo/workflows/security-trusted.yml
    secrets:
      SOCKET_API_KEY: ${{ secrets.SOCKET_API_KEY }}

  railway:
    name: Railway
    needs:
      - build
      - security
    runs-on: node24
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: https://data.forgejo.org/actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ forgejo.sha }}

      - name: Install Railway CLI
        env:
          RAILWAY_CLI_SHA256: cdde3d70b24d0a1f7628c62d8705af1a444e44118a90fb7afed41e6afc529844
          RAILWAY_CLI_VERSION: 5.30.1
        run: |
          archive="$RUNNER_TEMP/railway.tar.gz"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            "https://github.com/railwayapp/cli/releases/download/v${RAILWAY_CLI_VERSION}/railway-v${RAILWAY_CLI_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$RAILWAY_CLI_SHA256" "$archive" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP"
          "$RUNNER_TEMP/railway" --version

      - name: Deploy to Railway
        run: >-
          "$RUNNER_TEMP/railway" up
          --ci
          --environment production
          --service "$RAILWAY_SERVICE"
          --message "Release $FORGEJO_REF_NAME"
        env:
          RAILWAY_SERVICE: ${{ secrets.RAILWAY_SERVICE }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
