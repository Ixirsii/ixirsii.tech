name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  cargo-check:
    runs-on: ubuntu-latest
    container: rust:1.95.0-trixie
    steps:
      - uses: actions/checkout@v4
      - name: Run cargo check
        run: cargo check --workspace

  trivy-scan:
    runs-on: ubuntu-latest
    container: rust:1.95.0-trixie
    steps:
      - uses: actions/checkout@v4
      - name: Install Trivy
        run: |
          apt-get update && apt-get install -y curl
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh
      - name: Scan filesystem
        run: trivy fs --severity HIGH,CRITICAL .

  socket-scan:
    runs-on: ubuntu-latest
    container: node:22-trixie
    steps:
      - uses: actions/checkout@v4
      - name: Run Socket CLI
        run: npx socket ci
        env:
          SOCKET_CLI_API_TOKEN: ${{ secrets.SOCKET_API_KEY }}
          SOCKET_CLI_ORG_SLUG: 9-developers

  deploy:
    runs-on: ubuntu-latest
    needs: [cargo-check, trivy-scan, socket-scan]
    if: github.ref == 'refs/heads/main'
    container: rust:1.95.0-trixie
    steps:
      - uses: actions/checkout@v4
      - name: Install Railway CLI
        run: curl -fsSL https://railway.app/install.sh | sh
      - name: Deploy to Railway
        run: railway up --service "${{ secrets.RAILWAY_SERVICE }}"
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
