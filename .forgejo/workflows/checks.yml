name: Checks

on:
  pull_request:
  workflow_call:

jobs:
  rust:
    name: Rust checks
    runs-on: ci-rust
    timeout-minutes: 20

    env:
      DATABASE_URL: postgres://ixirsii:ixirsii_test@postgres:5432/ixirsii_tech

    services:
      postgres:
        image: git.9dev.tech/9-developers/ci-postgres:18
        env:
          POSTGRES_USER: ixirsii
          POSTGRES_PASSWORD: ixirsii_test
          POSTGRES_DB: ixirsii_tech
        options: >-
          --health-cmd "pg_isready -U ixirsii -d ixirsii_tech"
          --health-interval 2s --health-timeout 5s --health-retries 30

    steps:
      - name: Check out repository
        uses: https://data.forgejo.org/actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ forgejo.sha }}

      - name: Install Tailwind CSS
        run: |
          npm install --no-save --no-package-lock @tailwindcss/cli@4.3.3 tailwindcss@4.3.3
          echo "$PWD/node_modules/.bin" >> "$FORGEJO_PATH"

      - name: Test deployment script
        run: node --test .forgejo/scripts/deploy.test.mjs

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Prepare database for SQLx compile-time checks
        run: |
          cargo install sqlx-cli --version 0.9.0 --locked --no-default-features --features postgres
          cargo sqlx migrate run

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --all-targets
