name: Checks

on:
  pull_request:
  workflow_call:

jobs:
  rust:
    name: Rust checks
    runs-on: ci-rust
    timeout-minutes: 20

    env:
      DATABASE_URL: postgres://ixirsii:ixirsii_test@postgres:5432/ixirsii_tech

    services:
      postgres:
        image: git.9dev.tech/9-developers/ci-postgres:18
        env:
          POSTGRES_USER: ixirsii
          POSTGRES_PASSWORD: ixirsii_test
          POSTGRES_DB: ixirsii_tech

    steps:
      - name: Check out repository
        uses: https://data.forgejo.org/actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ forgejo.sha }}

      - name: Install build and telemetry test tools
        run: |
          pkg install -y python3 devel/py-opentelemetry-proto
          npm install --no-save --no-package-lock @tailwindcss/cli@4.3.5 tailwindcss@4.3.5
          echo "$PWD/node_modules/.bin" >> "$FORGEJO_PATH"

      - name: Test deployment script
        run: node --test .forgejo/scripts/deploy.test.mjs

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Wait for PostgreSQL over the job network
        shell: sh
        run: |
          set -eu
          pkg install -y postgresql18-client
          export PGCONNECT_TIMEOUT=2
          for attempt in $(jot 30); do
            if [ "$(psql -XAt "$DATABASE_URL" -c 'SELECT 1')" = 1 ]; then
              exit 0
            fi
            sleep 1
          done
          echo "PostgreSQL did not answer SELECT 1 after 30 attempts" >&2
          exit 1

      - name: Prepare database for SQLx compile-time checks
        run: |
          cargo install sqlx-cli --version 0.9.0 --locked --no-default-features --features postgres
          cargo sqlx migrate run

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Check generated CSS
        run: git diff --exit-code --stat -- public/main.css

      - name: Test
        run: cargo test --locked --all-targets

      - name: Check local OTLP export
        env:
          # Git blob of scripts/check_otlp.py in 9dev-site-lib.
          OTLP_CHECK_BLOB: 616b15cd571f9a155b4299cce14483f8da15275f
        run: |
          git fetch --no-tags --no-write-fetch-head --depth=1 https://git.9dev.tech/9-Developers/9dev-site-lib.git "$OTLP_CHECK_BLOB"
          git cat-file blob "$OTLP_CHECK_BLOB" > "$RUNNER_TEMP/check_otlp.py"
          cargo build --locked --bin ixirsii-tech
          python3 "$RUNNER_TEMP/check_otlp.py" --server target/debug/ixirsii-tech --service ixirsii.tech \
            --get /blog /blog 200 \
            --get '/blog/private-input?private-input=value' '/blog/{slug}' 404 \
            --get /site.webmanifest static 200 \
            --get /android-chrome-192x192.png static 200
