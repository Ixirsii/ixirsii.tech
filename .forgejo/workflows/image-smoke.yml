name: Linux image smoke test
on: workflow_dispatch

jobs:
  package:
    runs-on: ci-railway
    outputs:
      image: ${{ steps.package.outputs.image }}
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: smoke
        options: --health-cmd pg_isready --health-interval 2s --health-retries 30
    steps:
      - uses: https://data.forgejo.org/actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - id: package
        shell: bash
        env:
          DATABASE_URL: postgres://postgres:smoke@postgres:5432/postgres
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          set -eu
          DOCKER_CONFIG=$(mktemp -d)
          export DOCKER_CONFIG
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT
          registry=${FORGEJO_SERVER_URL#https://}
          repo="$registry/${FORGEJO_REPOSITORY,,}"
          tag="$repo:smoke-$FORGEJO_RUN_ID"
          cargo sqlx migrate run
          cargo build --release --locked
          printf '%s' "$REGISTRY_TOKEN" | crane auth login "$registry" -u "$REGISTRY_USER" --password-stdin
          bash .forgejo/scripts/package-image.sh target/release/ixirsii-tech "$tag"
          echo "image=$repo@$(crane digest "$tag")" >> "$FORGEJO_OUTPUT"

  health:
    needs: package
    runs-on: node-24
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: smoke
      web:
        image: ${{ needs.package.outputs.image }}
        credentials:
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_TOKEN }}
        env:
          DATABASE_URL: postgres://postgres:smoke@postgres:5432/postgres
        options: --restart on-failure
    steps:
      - run: curl --fail --retry 30 --retry-all-errors --retry-delay 2 http://web:3000/health
