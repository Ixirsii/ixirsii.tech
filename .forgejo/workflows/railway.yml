name: Railway deploy

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string

concurrency:
  group: railway-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  railway:
    name: Railway
    runs-on: node-24
    timeout-minutes: 30
    env:
      RAILWAY_ENVIRONMENT: ${{ inputs.environment }}
      RAILWAY_SERVICE: ${{ secrets.RAILWAY_SERVICE }}
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - name: Check out repository
        uses: https://data.forgejo.org/actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ forgejo.sha }}

      - name: Install Railway CLI
        env:
          RAILWAY_CLI_SHA256: 57911c6d61881e8f47d00df42f02b94d85b5e82dcd96b8bc84bd121be58a8332
          RAILWAY_CLI_VERSION: 5.74.1
        run: |
          archive="$RUNNER_TEMP/railway.tar.gz"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            "https://github.com/railwayapp/cli/releases/download/v${RAILWAY_CLI_VERSION}/railway-v${RAILWAY_CLI_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$RAILWAY_CLI_SHA256" "$archive" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP"
          "$RUNNER_TEMP/railway" --version

      - name: Deploy and wait for health check
        run: node .forgejo/scripts/deploy.mjs deploy
        env:
          RAILWAY_BIN: ${{ runner.temp }}/railway
