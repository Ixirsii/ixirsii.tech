name: Railway image deployment

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string

concurrency:
  group: railway-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  railway:
    runs-on: ci-railway
    timeout-minutes: 60
    steps:
      - uses: https://data.forgejo.org/actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ forgejo.sha }}

      - name: Migrate, validate and deploy image
        run: bash .forgejo/scripts/release.sh
        env:
          RAILWAY_ENVIRONMENT: ${{ inputs.environment }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
          RAILWAY_SERVICE: ${{ secrets.RAILWAY_SERVICE }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          TUNNEL_API_TOKEN: ${{ secrets.TUNNEL_API_TOKEN }}
          TUNNEL_SSH_KEY: ${{ secrets.TUNNEL_SSH_KEY }}
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          FORGEJO_API_URL: ${{ forgejo.api_url }}
          FORGEJO_REPOSITORY: ${{ forgejo.repository }}
          FORGEJO_TOKEN: ${{ forgejo.token }}
          RELEASE_RUN_ID: ${{ forgejo.run_id }}
