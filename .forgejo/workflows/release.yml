name: Deploy production

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  validate:
    name: Validate release
    runs-on: node-24
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: https://data.forgejo.org/actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ forgejo.sha }}

      - name: Validate release tag
        run: |
          if [[ ! "$FORGEJO_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Invalid release tag: $FORGEJO_REF_NAME"
            exit 1
          fi

      - name: Verify release is on main
        run: |
          if ! git merge-base --is-ancestor "$FORGEJO_SHA" origin/main; then
            echo "Tagged commit is not an ancestor of main: $FORGEJO_SHA"
            exit 1
          fi

      - name: Require successful staging deployment of this commit
        run: node .forgejo/scripts/deploy.mjs verify-staging
        env:
          FORGEJO_API_URL: ${{ forgejo.api_url }}
          FORGEJO_REPOSITORY: ${{ forgejo.repository }}
          FORGEJO_TOKEN: ${{ forgejo.token }}

  build:
    needs: validate
    uses: ./.forgejo/workflows/build.yml

  security:
    needs: validate
    uses: ./.forgejo/workflows/security.yml

  railway:
    needs: [build, security]
    uses: ./.forgejo/workflows/railway.yml
    with:
      environment: production
    secrets:
      RAILWAY_SERVICE: ${{ secrets.RAILWAY_SERVICE }}
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
