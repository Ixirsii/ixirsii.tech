name: Build

on:
  pull_request:
  workflow_call:

jobs:
  rust:
    name: Rust build
    runs-on: ci-rust
    timeout-minutes: 20

    env:
      DATABASE_URL: postgres://ixirsii:ixirsii_test@postgres:5432/ixirsii_tech

    services:
      postgres:
        image: git.9dev.tech/9-developers/ci-postgres:18
        env:
          POSTGRES_USER: ixirsii
          POSTGRES_PASSWORD: ixirsii_test
          POSTGRES_DB: ixirsii_tech

    steps:
      - name: Check out repository
        uses: https://data.forgejo.org/actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ forgejo.sha }}

      - name: Install Tailwind CSS
        run: |
          npm install --no-save --no-package-lock @tailwindcss/cli@4.3.3 tailwindcss@4.3.3
          echo "$PWD/node_modules/.bin" >> "$FORGEJO_PATH"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Test deployment health-check wait
        run: node --test .forgejo/scripts/deploy.test.mjs

      - name: Clippy
        run: SQLX_OFFLINE=true cargo clippy --locked --all-targets -- -D warnings

      - name: Check PostgreSQL service connectivity
        shell: sh
        run: |
          set -eu
          pkg install -y postgresql18-client
          export PGCONNECT_TIMEOUT=2
          for attempt in $(jot 30); do
            if [ "$(psql -XAt "$DATABASE_URL" -c 'SELECT 1')" = 1 ]; then
              exit 0
            fi
            sleep 1
          done
          getent hosts postgres || true
          exit 1

      - name: Test with isolated PostgreSQL
        run: SQLX_OFFLINE=true cargo test --locked --all-targets

      - name: Build
        run: SQLX_OFFLINE=true cargo build --locked
