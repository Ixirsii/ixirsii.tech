[package]
name = "ixirsii-tech"
version = "0.1.0"
edition = "2024"
authors = ["Ryan Porterfield <ixirsii@9dev.tech>"]
description = "ixirsii.tech HTMX website"
license = "BSD 3-Clause"
repository = "https://codeberg.org/Ixirsii/ixirsii.tech"
readme = "README.md"
keywords = ["web", "axum", "htmx", "blog"]
categories = ["web-programming"]

[dependencies]
askama = "0.16.0"
ammonia = "4.1.2"
argon2 = "0.5.3"
chrono = "0.4"
pulldown-cmark = "0.13"
axum = "0.8.9"
axum-htmx = "0.8.1"
axum-login = "0.18.0"
dotenvy = "0.15.7"
serde = { version = "1.0", features = ["derive"] }
sqlx = { version = "0.8.6", features = [
  "mysql",
  "runtime-tokio",
  "tls-native-tls",
  "migrate",
  "chrono",
] }
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread"] }
tower-sessions = { version = "0.14.0", features = ["memory-store"] }
tower-http = { version = "0.6.11", features = ["fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
opentelemetry = { version = "0.28", features = ["trace"] }
opentelemetry_sdk = { version = "0.28", features = ["trace", "rt-tokio"] }
opentelemetry-otlp = { version = "0.28", default-features = false, features = ["trace", "http-proto", "reqwest-blocking-client"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
tracing-opentelemetry = "0.29"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
cargo = { level = "warn", priority = -1 }
expect_used = "deny"
missing_errors_doc = "deny"
missing_panics_doc = "deny"
multiple_crate_versions = "allow"
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
too_many_arguments = "allow"
unwrap_used = "deny"
