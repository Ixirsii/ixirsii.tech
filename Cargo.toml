[package]
name = "ixirsii-tech"
version = "1.0.3"
edition = "2024"
authors = ["Ryan Porterfield <ixirsii@9dev.tech>"]
description = "ixirsii.tech website"
license = "BSD-3-Clause"
repository = "https://codeberg.org/Ixirsii/ixirsii.tech"
readme = "README.md"
keywords = ["web", "axum", "htmx", "blog"]
categories = ["web-programming"]

[build-dependencies]
sha2 = "0.11.0"

[dependencies]
ammonia = "4.1.2"
argon2 = "0.5.3"
askama = "0.16.0"
async-trait = "0.1"
axum = "0.8.9"
axum-extra = { version = "0.12.6", default-features = false, features = [
  "form",
  "cookie-signed",
] }
axum-login = "0.18.0"
chrono = "0.4"
dotenvy = "0.15.7"
include_dir = "0.7"
ipnet = "2.11"
mime_guess = "2.0.5"
pulldown-cmark = "0.13.4"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = [
  "blocking",
  "rustls",
] }
rmp-serde = "1.3.1"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.0"
sqlx = { version = "0.9.0", default-features = false, features = [
  "chrono",
  "derive",
  "macros",
  "migrate",
  "postgres",
  "runtime-tokio",
  "tls-rustls-aws-lc-rs",
] }
subtle = "2.6"
time = "0.3.55"
tokio = { version = "1.53.1", features = [
  "macros",
  "rt-multi-thread",
  "sync",
  "time",
] }
tower-sessions = "0.14.0"
tracing = "0.1.44"

[dev-dependencies]
serde_json = "1.0"
tower = { version = "0.5", features = ["util"] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
cargo = { level = "warn", priority = -1 }
expect_used = "deny"
missing_errors_doc = "deny"
missing_panics_doc = "deny"
multiple_crate_versions = "allow"
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
too_many_arguments = "allow"
unwrap_used = "deny"
