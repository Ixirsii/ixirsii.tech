[package]
authors = ["Ryan Porterfield <ixirsii@9dev.tech>"]
categories = ["web-programming"]
description = "ixirsii.tech website"
edition = "2024"
keywords = ["blog", "htmx", "web"]
license = "BSD-3-Clause"
name = "ixirsii-tech"
readme = "README.md"
repository = "https://github.com/Ixirsii/ixirsii.tech"
version = "1.2.3"

[build-dependencies]
nine_dev_site_build = "0.2.1"

[dependencies]
ammonia = "4.1.2"
argon2 = "0.5.3"
askama = "0.16.0"
async-trait = "0.1"
axum = "0.8.9"
axum-extra = { version = "0.12.6", default-features = false, features = [
  "form",
  "cookie-signed",
] }
axum-login = "0.18.0"
chrono = "0.4"
include_dir = "0.7"
inquire = { version = "0.9.5", default-features = false, features = [
  "crossterm",
] }
ipnet = "2.11"
nine_dev_site_lib = { version = "0.8.0", features = [
  "axum",
  "htmx",
  "startup",
  "telemetry",
] }
pulldown-cmark = "0.13.4"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = [
  "blocking",
  "rustls",
] }
rmp-serde = "1.3.1"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.0"
sqlx = { version = "0.9.0", default-features = false, features = [
  "chrono",
  "derive",
  "macros",
  "migrate",
  "postgres",
  "runtime-tokio",
  "tls-rustls-aws-lc-rs",
] }
subtle = "2.6"
time = "0.3.55"
tokio = { version = "1.53.1", features = [
  "macros",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
tower-sessions = "0.14.0"
tracing = "0.1.44"

[dev-dependencies]
serde_json = "1.0"
tower = { version = "0.5", features = ["util"] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
cargo = { level = "warn", priority = -1 }
expect_used = "deny"
missing_errors_doc = "deny"
missing_panics_doc = "deny"
multiple_crate_versions = "allow"
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
too_many_arguments = "allow"
unwrap_used = "deny"
